# Publie une version de LogiHub : pousser une étiquette vX.Y.Z (même numéro que « Version: » dans logiprof-espace-enseignants.php),
# ou créer la release vX.Y.Z sur GitHub. Le .zip installable (dossier « logiprof-espace-enseignants ») est joint à la release ;
# les sites WordPress le proposent alors en mise à jour.
name: Publier une version

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le numéro de version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^ \* Version: ${TAG}$" logiprof-espace-enseignants.php || { echo "::error::L'en-tête n'indique pas « Version: ${TAG} »"; exit 1; }
          grep -q "define( 'LOGIHUB_VERSION', '${TAG}' );" logiprof-espace-enseignants.php || { echo "::error::LOGIHUB_VERSION n'est pas ${TAG}"; exit 1; }

      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Construire le .zip
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir -p build
          git archive --format=zip --prefix=logiprof-espace-enseignants/ -o "build/logihub-${TAG}.zip" HEAD
          unzip -l "build/logihub-${TAG}.zip" | grep -q 'logiprof-espace-enseignants/logiprof-espace-enseignants.php'

      - name: Notes de version (section du readme.txt)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="= ${TAG} =" 'index($0, v) == 1 {on=1; next} on && /^= [0-9]/ {exit} on' readme.txt > build/notes.md
          [ -s build/notes.md ] || echo "LogiHub ${TAG}" > build/notes.md

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "build/logihub-${TAG}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "build/logihub-${TAG}.zip" --title "LogiHub ${TAG}" --notes-file build/notes.md
          fi
